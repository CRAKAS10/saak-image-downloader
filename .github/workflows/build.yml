name: Build & Release Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Smoke-test engine import
        run: python -c "import saak_engine; print('engine ok')"
      - run: pyinstaller --noconfirm --onefile --windowed --name Product_Image_Downloader --icon app.ico --add-data "app.ico;." saak_app.py
      - uses: actions/upload-artifact@v4
        with: { name: Product_Image_Downloader, path: dist/Product_Image_Downloader.exe }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1
          name: Product Image Downloader v2.1
          make_latest: true
          body: |
            تطبيق سطح مكتب (Windows) لتنزيل صور منتجات ساك الأصلية مع فهرس CSV وأرشيف ZIP.
            حمّل Product_Image_Downloader.exe وشغّله مباشرة — لا يحتاج Python.
          files: dist/Product_Image_Downloader.exe
